name: mkdocs
on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@vmaster
      - uses: actions/setup-python@master
        with:
          python-version: 3.x
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs gh-deploy --force --clean --verbose
